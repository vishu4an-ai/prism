name: Update news

on:
  schedule:
    - cron: "*/30 * * * *"   # about every 30 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the fetcher's two libraries
        run: pip install -r requirements.txt

      - name: Fetch and group the news
        run: python tools/fetch_news.py --out site/news.json

      - name: Assemble the site
        run: |
          cp index.html app.css app.js sw.js manifest.webmanifest site/
          cp -r fonts icons site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
